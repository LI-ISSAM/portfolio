spring:
  application:
    name: portfolio
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio
    username: portfolio
    password: portfolio
    hikari:
      maximum-ppol-size: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}

server:
  port: ${PORT:8080}
